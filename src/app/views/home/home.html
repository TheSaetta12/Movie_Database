<div class="page">
    <h2>🔥 Film Popolari</h2>
    <div class="grid">
        <!-- Qui verranno visualizzati i film caricati da API -->
         @if(movies$ | async; as movies){
            @for(movie of movies.results; track $index) {
                <app-movie-card [movieInput]="movie"(movieClicked)="openDetail($event)"></app-movie-card>
            }
         }
    </div>
</div>
